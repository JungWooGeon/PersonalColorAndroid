[versions]
agp = "9.5.0"
kotlin = "2.4.21"
ksp = "2.3.13"
hilt = "2.60.1"
androidxHilt = "1.4.0"
composeBom = "2026.09.00"
lifecycle = "2.11.0"
navigation = "2.10.2"
aboutlibraries = "15.3.0"

[libraries]
androidx-core-ktx = "androidx.core:core-ktx:1.19.1"
androidx-activity-compose = "androidx.activity:activity-compose:1.13.0"
androidx-core-splashscreen = "androidx.core:core-splashscreen:1.2.0"
androidx-lifecycle-runtime-compose = { module = "androidx.lifecycle:lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-navigation-compose = { module = "androidx.navigation:navigation-compose", version.ref = "navigation" }
androidx-datastore-preferences = "androidx.datastore:datastore-preferences:1.3.0"
androidx-exifinterface = "androidx.exifinterface:exifinterface:1.4.1"
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-material3-adaptive = { module = "androidx.compose.material3.adaptive:adaptive" }
androidx-compose-material3-navigationSuite = { module = "androidx.compose.material3:material3-adaptive-navigation-suite" }
androidx-compose-material-icons = { module = "androidx.compose.material:material-icons-extended" }
hilt-android = { module = "com.google.dagger:hilt-android", version.ref = "hilt" }
hilt-compiler = { module = "com.google.dagger:hilt-compiler", version.ref = "hilt" }
androidx-hilt-navigation-compose = { module = "androidx.hilt:hilt-navigation-compose", version.ref = "androidxHilt" }
kotlinx-serialization-json = "org.jetbrains.kotlinx:kotlinx-serialization-json:1.12.0"
kotlinx-coroutines-test = "org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0"
mediapipe-tasks-vision = "com.google.mediapipe:tasks-vision:0.10.32"
play-services-ads = "com.google.android.gms:play-services-ads:25.5.0"
ump = "com.google.android.ump:user-messaging-platform:4.0.0"
play-review = "com.google.android.play:review-ktx:2.0.2"
billing = "com.android.billingclient:billing-ktx:9.1.0"
glance-appwidget = "androidx.glance:glance-appwidget:1.2.0"
glance-material3 = "androidx.glance:glance-material3:1.2.0"
play-services-location = "com.google.android.gms:play-services-location:21.4.0"
work-runtime = "androidx.work:work-runtime-ktx:2.12.0"
camerax-core = "androidx.camera:camera-core:1.6.2"
camerax-camera2 = "androidx.camera:camera-camera2:1.6.2"
camerax-lifecycle = "androidx.camera:camera-lifecycle:1.6.2"
camerax-compose = "androidx.camera:camera-compose:1.6.2"
kakao-share = "com.kakao.sdk:v2-share:2.26.0"
aboutlibraries-compose = { module = "com.mikepenz:aboutlibraries-compose-m3", version.ref = "aboutlibraries" }
junit = "junit:junit:4.13.2"

# Gradle plugins, as build-logic dependencies
android-gradlePlugin = { module = "com.android.tools.build:gradle", version.ref = "agp" }
kotlin-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-gradle-plugin", version.ref = "kotlin" }
compose-gradlePlugin = { module = "org.jetbrains.kotlin:compose-compiler-gradle-plugin", version.ref = "kotlin" }
serialization-gradlePlugin = { module = "org.jetbrains.kotlin:kotlin-serialization", version.ref = "kotlin" }
ksp-gradlePlugin = { module = "com.google.devtools.ksp:symbol-processing-gradle-plugin", version.ref = "ksp" }
hilt-gradlePlugin = { module = "com.google.dagger:hilt-android-gradle-plugin", version.ref = "hilt" }
aboutlibraries-gradlePlugin = { module = "com.mikepenz.aboutlibraries.plugin:aboutlibraries-plugin", version.ref = "aboutlibraries" }
